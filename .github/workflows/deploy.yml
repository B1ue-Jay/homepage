name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 让所有 JS Action 提前使用 Node.js 24 运行时，消除 actions/deploy-pages 的
# “Node.js 20 actions are deprecated” 弃用警告。这是 GitHub 官方提供的过渡开关；
# 2026-06-16 起 Node 24 会成为默认值，届时此变量自动变为无副作用，可保留也可删除。
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

# Allow one concurrent deployment, don't cancel in-progress runs.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build Astro site
        uses: withastro/action@v3
        # withastro/action installs deps, runs `astro build`, and uploads
        # the artifact. It auto-detects the package manager and uses Node 20.

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
